name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          # The engines floor (>=20).
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here: the pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:perf
      - run: pnpm check:deps
      - run: pnpm check:secrets
      - run: pnpm eval:rules
      - name: Keep the eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report-${{ matrix.os }}-${{ matrix.node }}
          path: eval/reports/*.json
          if-no-files-found: warn

      - name: Build the adapter bundle
        run: pnpm build

      - run: pnpm check:bundle

      # Run the bundle from an empty directory with no node_modules anywhere above it, so an
      # un-inlined dependency cannot be satisfied by the workspace.
      - name: Smoke-test the single-file bundle
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp packages/adapter/dist/prosegate.mjs "$tmp/"
          cd "$tmp"
          node prosegate.mjs --version

      # The published artefact is the tarball, not the workspace: install it into an empty project.
      - name: Pack and install the tarball
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          pnpm --filter prosegate pack --pack-destination "$tmp"
          cd "$tmp"
          mkdir project
          cd project
          npm init -y
          npm install ../prosegate-*.tgz
          npx prosegate --version
