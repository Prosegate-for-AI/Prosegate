name: publish-pack
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: config-pack-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: config-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:publish-pack
        env:
          PROSEGATE_CONFIG_URL: ${{ vars.PROSEGATE_CONFIG_URL }}
          PROSEGATE_PUBLISH_TOKEN: ${{ secrets.PROSEGATE_PUBLISH_TOKEN }}
