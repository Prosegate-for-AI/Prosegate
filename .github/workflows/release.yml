name: npm preview release

# Dispatch against an existing v0.1.0-alpha.N / v0.1.0-rc.N tag.
on:
  workflow_dispatch:
    inputs:
      bootstrap_attestation:
        description: First alpha only - sign the checked tarball for local npm publication with 2FA
        type: boolean
        default: false
      evaluation_run:
        description: Successful paid-evaluation run ID at this commit (required for RC)
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref_type == 'tag' && !github.event.repository.private
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Require complete corpus for release candidates
        if: contains(github.ref_name, '-rc.')
        run: pnpm eval:corpus --require-pass true
      - name: Retrieve same-commit evaluation evidence
        if: contains(github.ref_name, '-rc.')
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_RUN: ${{ inputs.evaluation_run }}
        shell: bash
        run: |
          [[ "$EVALUATION_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVALUATION_RUN" > "$RUNNER_TEMP/run.json"
          node scripts/release-evidence.mjs "$RUNNER_TEMP/run.json"
          gh run download "$EVALUATION_RUN" --name "paid-eval-$EVALUATION_RUN" --dir "$RUNNER_TEMP/evidence"
          report=$(find "$RUNNER_TEMP/evidence" -maxdepth 1 -name '*-release-*.json')
          test -f "$report"
          echo "PROSEGATE_RELEASE_REPORT=$report" >> "$GITHUB_ENV"
      - run: pnpm release:prepare "$RUNNER_TEMP/release" --strict
      - name: Upload exact checked package and checksums for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-preview
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/RELEASE.md
            ${{ runner.temp }}/release/package/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-preview
          path: ${{ runner.temp }}/release
      - name: Publish verified tarball using npm trusted publishing
        if: ${{ !inputs.bootstrap_attestation }}
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: node scripts/publish-release.mjs
      - name: Sign first-release tarball without npm credentials
        if: inputs.bootstrap_attestation
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: node scripts/attest-release.mjs
      - name: Retain signed first-release artifact
        if: inputs.bootstrap_attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-bootstrap
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
